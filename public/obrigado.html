<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060f1c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Inscrição recebida | Seja Fornecedor para o Poder Público</title>

    <!-- Meta Pixel: base + PageView + Lead (dispara apenas nesta página) -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />

    <style>
      :root {
        --navy: #0a1828;
        --navy-deep: #060f1c;
        --cyan: #22b8f0;
        --gold: #f5b700;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 24px 20px;
        background: radial-gradient(ellipse at top, var(--navy) 0%, var(--navy-deep) 60%);
        color: #fff;
        font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 560px;
        padding: 40px 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(34, 184, 240, 0.15);
        color: var(--cyan);
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--cyan);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 26px;
        line-height: 1.25;
        font-weight: 700;
        text-wrap: balance;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
      }
      p + p { margin-top: 12px; }
      strong { color: var(--gold); font-weight: 600; }
      @media (min-width: 640px) {
        .card { padding: 56px 48px; }
        h1 { font-size: 32px; }
        p { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1168799437651546&ev=PageView&noscript=1" />
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1168799437651546&ev=Lead&noscript=1" />
    </noscript>

    <main class="card">
      <div class="check" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12 5 5L20 7" />
        </svg>
      </div>
      <p class="eyebrow">Inscrição recebida</p>
      <h1>Recebemos seus dados. Agora é com a gente.</h1>
      <p>
        Um consultor entra em contato pelo <strong>WhatsApp</strong> para tirar suas dúvidas
        e concluir a inscrição.
      </p>
      <p>Fique atento ao seu celular nas próximas horas.</p>
    </main>
  </body>
</html>
